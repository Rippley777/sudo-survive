[package]
license-file = "../../LICENSE"
name = "sudo-survive-sim"
version = "0.1.0"
edition = "2021"

[features]
default = ["local-store", "dev-bridge"]
local-store = ["dep:rusqlite"]
dev-bridge = ["local-store", "dep:tiny_http"]

[[bin]]
name = "bridge"
path = "src/bin/bridge.rs"
required-features = ["dev-bridge"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
tiny_http = { version = "0.12", optional = true }
